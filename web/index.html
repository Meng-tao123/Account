<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人记账本</title>
</head>
<body>
  <header>
    <h1>个人记账本</h1>
    <p>项目骨架已启动，各功能由组员接入。</p>
    <nav aria-label="记账本功能">
      <ul>
        <li><a href="#record">记一笔</a></li>
        <li><a href="#recent">最近记录</a></li>
        <li><a href="#stats">收支统计</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="record" aria-labelledby="record-title">
      <h2 id="record-title">记一笔</h2>
      <div id="record-panel"><p>待接入记账表单。</p></div>
    </section>
    <section id="recent" aria-labelledby="recent-title">
      <h2 id="recent-title">最近记录</h2>
      <div id="recent-panel"><p>待接入最近记录列表。</p></div>
    </section>
    <section id="stats" aria-labelledby="stats-title">
      <h2 id="stats-title">收支统计</h2>
      <div id="stats-panel"><p>待接入统计筛选与结果。</p></div>
    </section>
  </main>
</body>
</html>
